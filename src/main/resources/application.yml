server:
  port: 8080

spring:
  application:
    name: transacciones-service
  datasource:
    url: jdbc:h2:mem:transaccionesdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

# Regla de negocio: plazo máximo para reversar desde la fecha de creación
transacciones:
  reversion:
    plazo-maximo: 24h
